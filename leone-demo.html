<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Il leone di Leo</title>
<meta name="description" content="Il leone dorato di Leo: tocca il leone per sentirlo ruggire.">
<meta name="theme-color" content="#07070A">
<link rel="icon" href="img/stemma_32.png">
<link rel="stylesheet" href="css/leone.css">
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #07070A;
    color: #B4B4BE;
    font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    display: grid;
    grid-template-rows: 1fr auto;
    min-height: 100vh;
    min-height: 100svh;
    overflow-x: hidden;
  }
  main {
    display: grid;
    place-items: center;
    padding: clamp(8px, 3vw, 32px) 16px 0;
    min-height: 0;
  }
  .demo-leone {
    width: min(100%, calc((100vh - 120px) * 920 / 700), 1400px);
    width: min(100%, calc((100svh - 120px) * 920 / 700), 1400px);
  }
  footer {
    display: flex;
    gap: 12px 24px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    padding: 12px 16px 20px;
    letter-spacing: .04em;
    font-size: 13px;
  }
  footer .suggerimento { color: #D4A64A; text-transform: uppercase; letter-spacing: .18em; font-size: 12px; }
  footer a { color: #B4B4BE; text-decoration: none; border-bottom: 1px solid #3A3A42; }
  footer a:hover, footer a:focus-visible { color: #F2CF7A; border-color: #D4A64A; outline: none; }
  @media (hover: none) { .solo-mouse { display: none; } }
  @media (hover: hover) { .solo-tocco { display: none; } }
</style>
</head>
<body>
<main>
  <div class="leone-scena demo-leone" data-leone="demo"></div>
</main>
<footer>
  <span class="suggerimento"><span class="solo-mouse">Clicca</span><span class="solo-tocco">Tocca</span> il leone per farlo ruggire</span>
  <a href="index.html">Torna al sito di Leo</a>
</footer>
<script src="js/leone.js"></script>
</body>
</html>
